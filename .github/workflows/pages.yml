# GitHub Pages: publishes the demo site.
#
# The published artifact is static: `_site/demo/` plus `_site/dist/`. The library has to be built
# here, because `dist/` is not stored in git and the demo imports it the way a consumer does
# (`../dist/index.js`), not as a copy of the sources.
#
# Pages has to be enabled for the repository first (Settings → Pages → Source: GitHub Actions).
# Without it `actions/configure-pages` fails, and the deployment never starts.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: parallel Pages publishes conflict.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: demo site build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build _site (demo + dist)
        run: node scripts/build-demo-site.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
